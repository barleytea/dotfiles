name: Windows CTF CI

on:
  push:
    branches: [main]
    paths:
      - 'windows-ctf/**'
      - '.github/workflows/windows-host.yml'
  pull_request:
    branches: [main]
    paths:
      - 'windows-ctf/**'
      - '.github/workflows/windows-host.yml'

jobs:
  bash-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Bash syntax check
        run: |
          find windows-ctf -name '*.sh' | while IFS= read -r f; do
            bash -n "$f" || exit 1
            echo "[OK] $f"
          done

      - name: Validate JSON files
        run: |
          find windows-ctf -name '*.json' | while IFS= read -r f; do
            jq . "$f" > /dev/null || exit 1
            echo "[OK] $f"
          done

  setup-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Stub network install scripts (skip in CI)
        run: |
          for script in install-bash-tools.sh install-tailscale.sh; do
            cat > "windows-ctf/scripts/${script}" <<'EOF'
          #!/usr/bin/env bash
          echo "[STUB] ${0##*/} skipped in CI"
          EOF
          done

      - name: Run setup-bash.sh
        run: bash windows-ctf/scripts/setup-bash.sh

      - name: Verify symlinks exist
        run: |
          for f in \
            "$HOME/.config/bash/bashrc.sh" \
            "$HOME/.config/starship/starship.toml" \
            "$HOME/.config/atuin/config.toml" \
            "$HOME/.config/sheldon/plugins.toml" \
            "$HOME/.tmux.conf" \
            "$HOME/.config/git/config" \
            "$HOME/.config/git/ignore" \
            "$HOME/.czrc"; do
            if [ -e "$f" ]; then
              echo "[OK] $f"
            else
              echo "[NG] missing: $f" && exit 1
            fi
          done

      - name: Verify .bashrc snippet
        run: |
          grep -q '\.config/bash/bashrc\.sh' "$HOME/.bashrc" \
            && echo "[OK] .bashrc snippet present" \
            || { echo "[NG] .bashrc snippet missing"; exit 1; }

      - name: Source bashrc.sh without errors
        run: bash "$HOME/.config/bash/bashrc.sh"

      - name: Run setup-claude.sh
        run: bash windows-ctf/scripts/setup-claude.sh

      - name: Verify Claude symlinks
        run: |
          # skills/generate-commit-msg はディレクトリごと symlink されるため、
          # 中の SKILL.md 自体は symlink にならない（親ディレクトリが symlink）。
          # ディレクトリの方を -L で検証する
          for f in \
            "$HOME/.claude/CLAUDE.md" \
            "$HOME/.claude/statusline.sh" \
            "$HOME/.claude/hooks/log-skill.sh" \
            "$HOME/.claude/skills/generate-commit-msg" \
            "$HOME/.claude/agents/explore.md"; do
            if [ -L "$f" ]; then
              echo "[OK] symlink: $f"
            else
              echo "[NG] not a symlink (or missing): $f" && exit 1
            fi
          done
          if [ -e "$HOME/.claude/skills/generate-commit-msg/SKILL.md" ]; then
            echo "[OK] reachable: $HOME/.claude/skills/generate-commit-msg/SKILL.md"
          else
            echo "[NG] missing: $HOME/.claude/skills/generate-commit-msg/SKILL.md" && exit 1
          fi

      - name: Verify Claude settings.json is a generated real file
        run: |
          f="$HOME/.claude/settings.json"
          if [ -L "$f" ]; then
            echo "[NG] $f must not be a symlink" && exit 1
          fi
          if [ ! -e "$f" ]; then
            echo "[NG] missing: $f" && exit 1
          fi
          jq empty "$f" && echo "[OK] $f is valid JSON"
          jq -e '(.hooks.PreToolUse|length) >= 2 and .permissions.defaultMode == "auto" and .env.CLAUDE_CODE_SUBAGENT_MODEL == "sonnet"' "$f" \
            && echo "[OK] $f overlay fields present" \
            || { echo "[NG] $f missing expected overlay fields"; exit 1; }
